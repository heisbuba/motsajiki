<!-- Schema -->
 <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Motsa Jiki",
  "url": "https://motsajiki.pages.dev/",
  "image": "https://motsajiki.pages.dev/icons/icon-512x512.png",
  "description": "Free offline workout tracker. Log exercises, track goals and streaks — no account, no tracking. Your data stays in your custody.",
  "applicationCategory": "HealthApplication",
  "operatingSystem": "Any (installable web app / PWA)",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"

<body>

<main class="page">

  <section class="block">
    <p class="hero-label" id="current-date-label">TODAY</p>
    <h2 class="hero-value" id="current-date">--</h2>
  </section>

  <section class="block">
    <div class="block-header">
      <h3>Quick Log</h3>
      <button class="icon-btn" id="toggle-custom-template-btn" aria-label="New custom task" style="width:auto; height:auto; padding:4px 8px; gap:4px; display:flex; align-items:center; font-family:var(--font-mono); font-size:11px; text-transform:uppercase;">
        <svg class="icon" style="width:16px;height:16px;"><use href="/icons/icons.svg#icon-add"></use></svg>New Task
      </button>
    </div>

    <div class="card" id="custom-template-form" style="display:none; flex-direction:column; gap:14px;">
      <div id="ct-manage-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      <div class="field-group">
        <label class="field-label" for="ct-name">Task Name</label>
        <input class="control" id="ct-name" type="text" placeholder="e.g. Kettlebell Swings" />
      </div>
      <div class="field-group">
        <label class="field-label" for="ct-category">Category</label>
        <input class="control" id="ct-category" type="text" placeholder="e.g. Strength" />
      </div>
      <div class="field-group">
        <label class="field-label">Metrics to Track</label>
        <div id="ct-fields-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button class="btn btn-ghost" id="ct-add-field-btn" type="button" style="height:40px; font-size:13px;">+ Add Metric</button>
      </div>
      <button class="btn btn-primary" id="ct-save-btn" type="button">Save Task</button>
    </div>

    <div class="card" style="display:flex; flex-direction:column; gap:16px;">
      <div class="field-group">
        <label class="field-label" for="template-selector">Task</label>
        <select class="control" id="template-selector"></select>
      </div>
      <div class="grid-2" id="log-fields-container"></div>
      <div class="field-group">
        <label class="field-label" for="log-notes">Notes (optional)</label>
        <input class="control" id="log-notes" type="text" placeholder="e.g. Morning warm-up session" />
      </div>
      <button class="btn btn-ghost" id="add-log-btn">
        <svg class="icon" style="width:18px;height:18px;"><use href="/icons/icons.svg#icon-add"></use></svg> Add Log
      </button>
    </div>
  </section>

  <section class="block">
    <div class="block-header">
      <h3>Today's Activity</h3>
      <span class="meta" id="today-count">0 ENTRIES</span>
    </div>
    <div id="activity-list" style="display:flex; flex-direction:column; gap:8px;">
      <div class="empty-state">No logs yet today. Add your first one above.</div>
    </div>
  </section>

  <section class="block" id="sync-controls" style="margin-bottom:16px;">
    <div class="block-header"><h3>Sync Controls</h3></div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <button class="sync-btn" data-action="sync-local">
        <span class="sync-btn-label">
          <svg class="icon" style="color:var(--on-surface-variant);"><use href="/icons/icons.svg#icon-folder_open"></use></svg>
          <span data-label="local">Local Folder</span>
        </span>
        <span class="dot dot-off" data-dot="local"></span>
      </button>
      <button class="sync-btn" data-action="sync-drive">
        <span class="sync-btn-label">
          <svg class="icon" style="color:var(--on-surface-variant);"><use href="/icons/icons.svg#icon-cloud"></use></svg>
          <span data-label="drive">Google Drive</span>
        </span>
        <span class="dot dot-off" data-dot="drive"></span>
      </button>
    </div>
  </section>

  <section class="block social-row">
  <div class="block-header"><h3>Join the Community</h3></div>
  <div class="social-icons">
    <a href="https://facebook.com/motsajikiapp" target="_blank" rel="noopener" aria-label="Facebook">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
    </a>
    <a href="https://x.com/motsajiki" target="_blank" rel="noopener" aria-label="X (Twitter)">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>
    <a href="https://tiktok.com/@motsajiki" target="_blank" rel="noopener" aria-label="TikTok">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.3-.7.32-1.08.07-2.37.02-4.74.02-7.12 0 0 .02-.01.05-.02z"/></svg>
    </a>
    <a href="mailto:support@motsajiki.com" aria-label="Support Email">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    </a>
  </div>
</section>
