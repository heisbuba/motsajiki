<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preload" href="/js/schema.js" as="script">
<link rel="preload" href="/js/db.js" as="script">
<link rel="preload" href="/js/app.js" as="script">
<link rel="preload" href="/icons/icon-192x192.png" as="image">
<title>Motsa Jiki — Offline Workout Tracker</title>
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet" />
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">
</head>
<body>

<main class="page">

  <section class="block">
    <p class="hero-label" id="current-date-label">TODAY</p>
    <h2 class="hero-value" id="current-date">--</h2>
    <button class="btn btn-primary" id="start-workout-btn" style="height:64px; margin-top:8px;">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">play_arrow</span>
      START WORKOUT
    </button>
  </section>

  <section class="block">
    <div class="block-header">
      <h3>Quick Log</h3>
      <button class="icon-btn" id="toggle-custom-template-btn" aria-label="New custom task" style="width:auto; height:auto; padding:4px 8px; gap:4px; display:flex; align-items:center; font-family:var(--font-mono); font-size:11px; text-transform:uppercase;">
        <span class="material-symbols-outlined" style="font-size:16px;">add</span>New Task
      </button>
    </div>

    <div class="card" id="custom-template-form" style="display:none; flex-direction:column; gap:14px;">
      <div id="ct-manage-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      <div class="field-group">
        <label class="field-label" for="ct-name">Task Name</label>
        <input class="control" id="ct-name" type="text" placeholder="e.g. Kettlebell Swings" />
      </div>
      <div class="field-group">
        <label class="field-label" for="ct-category">Category</label>
        <input class="control" id="ct-category" type="text" placeholder="e.g. Strength" />
      </div>
      <div class="field-group">
        <label class="field-label">Metrics to Track</label>
        <div id="ct-fields-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button class="btn btn-ghost" id="ct-add-field-btn" type="button" style="height:40px; font-size:13px;">+ Add Metric</button>
      </div>
      <button class="btn btn-primary" id="ct-save-btn" type="button">Save Task</button>
    </div>

    <div class="card" style="display:flex; flex-direction:column; gap:16px;">
      <div class="field-group">
        <label class="field-label" for="template-selector">Task</label>
        <select class="control" id="template-selector"></select>
      </div>
      <div class="grid-2" id="log-fields-container"></div>
      <div class="field-group">
        <label class="field-label" for="log-notes">Notes (optional)</label>
        <input class="control" id="log-notes" type="text" placeholder="e.g. Morning warm-up session" />
      </div>
      <button class="btn btn-ghost" id="add-log-btn">
        <span class="material-symbols-outlined" style="font-size:18px;">add</span> Add Log
      </button>
    </div>
  </section>

  <section class="block">
    <div class="block-header">
      <h3>Today's Activity</h3>
      <span class="meta" id="today-count">0 ENTRIES</span>
    </div>
    <div id="activity-list" style="display:flex; flex-direction:column; gap:8px;">
      <div class="empty-state">No logs yet today. Add your first one above.</div>
    </div>
  </section>

  <section class="block" id="sync-controls" style="margin-bottom:16px;">
    <div class="block-header"><h3>Sync Controls</h3></div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <button class="sync-btn" data-action="sync-local">
        <span class="sync-btn-label">
          <span class="material-symbols-outlined" style="color:var(--on-surface-variant);">folder_open</span>
          <span data-label="local">Local Folder</span>
        </span>
        <span class="dot dot-off" data-dot="local"></span>
      </button>
      <button class="sync-btn" data-action="sync-drive">
        <span class="sync-btn-label">
          <span class="material-symbols-outlined" style="color:var(--on-surface-variant);">cloud</span>
          <span data-label="drive">Google Drive</span>
        </span>
        <span class="dot dot-off" data-dot="drive"></span>
      </button>
    </div>
  </section>

  <section class="block social-row">
  <div class="block-header"><h3>Connect</h3></div>
  <div class="social-icons">
    <a href="https://facebook.com/motsajikiapp" target="_blank" rel="noopener" aria-label="Facebook">

    </a>

    </a>
  </div>
</section>

</main>

<script src="js/schema.js"></script>
<script src="js/db.js"></script>
<script src="js/filesystem.js"></script>
<script src="js/gdrive.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/log.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
