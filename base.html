<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motsa Jiki | Offline Workout Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet" />
  <!-- PWA manifest & icons -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">fitness_center</span>
      MOTSA JIKI
    </div>
    <div style="display: flex; gap: 8px;">
      <a class="icon-btn" href="/help.html" aria-label="Help and Legal Information">
      <span class="material-symbols-outlined">help_outline</span>
      </a>
      <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle Theme">
        <span class="material-symbols-outlined" id="theme-icon">bedtime</span>
      </button>
      <a class="icon-btn" href="/#sync-controls" aria-label="Sync status">
        <span class="material-symbols-outlined">cloud_sync</span>
      </a>
    </div>
  </header>

  <main class="page">
    <!-- Page-specific content goes here -->
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" data-nav-link="index.html" href="/">
      <span class="material-symbols-outlined">edit_note</span>Log
    </a>
    <a class="nav-item" data-nav-link="overview.html" href="/overview">
      <span class="material-symbols-outlined">monitoring</span>Overview
    </a>
    <a class="nav-item" data-nav-link="goals.html" href="/goals">
      <span class="material-symbols-outlined">flag</span>Goals
    </a>
    <a class="nav-item" data-nav-link="milestone.html" href="/milestone">
      <span class="material-symbols-outlined">military_tech</span>Badges
    </a>
  </nav>

  <!-- NEW: Toast notification container -->
  <div id="toast-host"></div>

  <script src="js/schema.js"></script>
  <script src="js/db.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/gdrive.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
